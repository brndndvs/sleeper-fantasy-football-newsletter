name: Adhoc Skattebo Debug

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Skattebo stats (correct roster per week)
        run: python _adhoc_skattebo_check2.py

      - name: Fetch Jefferson stats (correct roster per week)
        run: python _adhoc_jefferson_check2.py
