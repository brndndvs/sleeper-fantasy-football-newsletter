name: Commissioner Notes Reminder

on:
  schedule:
    # ~6:00 PM ET on Mondays, so there's time to fill it out before the Tuesday
    # newsletter. GitHub Actions cron always runs in UTC and has no DST awareness,
    # so two schedules cover the two ET offsets across the year -- accurate except
    # for the handful of days right at the DST switchover itself. Minute is 58,
    # not 0 -- GitHub's own docs warn that scheduled runs queue up (and can be
    # delayed well past their trigger time) worst at round :00/:15/:30/:45 marks
    # -- the top of the hour is called out specifically -- since that's when
    # everyone else's cron jobs fire too.
    - cron: "58 21 * 3-10 1" # EDT (UTC-4): Mar-Oct, ~6:00 PM ET Monday = 21:58 UTC Monday
    - cron: "58 22 * 11,12,1,2 1" # EST (UTC-5): Nov-Feb, ~6:00 PM ET Monday = 22:58 UTC Monday
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Email commissioner reminder
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          COMMISSIONER_EMAIL: ${{ secrets.COMMISSIONER_EMAIL }}
        run: python newsletter.py --remind-commissioner
