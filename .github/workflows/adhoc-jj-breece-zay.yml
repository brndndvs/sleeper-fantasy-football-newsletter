name: Adhoc JJ Breece Zay

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluate Jefferson for Breece Hall and Zay Flowers
        run: python _adhoc_jj_breece_zay.py
