name: Adhoc JSN Kyren

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluate Love and Jefferson for Smith-Njigba and Kyren Williams
        run: python _adhoc_jsn_kyren.py
