name: Adhoc Breece Zay Check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Breece Hall / Zay Flowers vs Jeremiah Love
        run: python _adhoc_breece_zay_check.py
