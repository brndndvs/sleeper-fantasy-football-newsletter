name: Adhoc Best GM Preview

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preview Best GM section
        run: python _adhoc_best_gm_preview.py
