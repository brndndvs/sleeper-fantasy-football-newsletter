name: Adhoc JJ Saquon Tet

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluate Jefferson for Saquon and McMillan
        run: python _adhoc_jj_saquon_tet.py
