name: Adhoc Debug

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'EOF'
          from newsletter import (
              get_league, get_rosters, get_users, build_teams,
              fetch_json, API_BASE, DEFAULT_LEAGUE_ID,
          )

          league_id = DEFAULT_LEAGUE_ID
          league = get_league(league_id)
          rosters = get_rosters(league_id)
          users = get_users(league_id)
          teams = build_teams(rosters, users)

          target_name = "Balls"
          target_roster_id = None
          roster_id_to_name = {}
          for r in rosters:
              team = teams.get(r["roster_id"])
              name = team.team_name if team else f"roster_{r['roster_id']}"
              roster_id_to_name[r["roster_id"]] = name
              if name == target_name:
                  target_roster_id = r["roster_id"]

          print(f"Balls roster_id = {target_roster_id}")
          print(f"Total rosters/teams: {len(rosters)}")

          settings = league.get("settings", {}) or {}
          print(f"League settings (draft-relevant keys): "
                f"{{k: v for k, v in settings.items() if 'draft' in k.lower() or 'round' in k.lower()}}"
                if False else {k: v for k, v in settings.items() if "draft" in k.lower() or "round" in k.lower()})

          traded_picks = fetch_json(f"{API_BASE}/league/{league_id}/traded_picks") or []
          print(f"\nTotal traded_picks records league-wide: {len(traded_picks)}")

          print("\n=== All traded_picks records involving Balls (as current or original owner) ===")
          for tp in traded_picks:
              if tp.get("owner_id") == target_roster_id or tp.get("roster_id") == target_roster_id:
                  season = tp.get("season")
                  rnd = tp.get("round")
                  orig_roster = tp.get("roster_id")
                  orig_name = roster_id_to_name.get(orig_roster, f"roster_{orig_roster}")
                  owner_id = tp.get("owner_id")
                  owner_name = roster_id_to_name.get(owner_id, f"roster_{owner_id}")
                  prev_owner = tp.get("previous_owner_id")
                  prev_name = roster_id_to_name.get(prev_owner, f"roster_{prev_owner}")
                  print(f"  season={season} round={rnd} originally={orig_name}'s pick | "
                        f"previous_owner={prev_name} -> current_owner={owner_name}")

          print("\n=== Balls' full pick ownership for 2027 and 2028 (own picks unless traded away, plus acquired picks) ===")
          num_rosters = len(rosters)
          for season in ["2027", "2028"]:
              print(f"\n{season}:")
              # Assume standard rounds 1-4 unless traded_picks show otherwise; report what's traded, rest are default-owned.
              traded_this_season = [tp for tp in traded_picks if tp.get("season") == season]
              rounds_seen = sorted(set(tp.get("round") for tp in traded_this_season)) or [1, 2, 3, 4]
              max_round = max(rounds_seen + [4])
              for rnd in range(1, max_round + 1):
                  # Does Balls originally own this round's pick (i.e. it's their own roster's slot)?
                  own_pick_traded = next(
                      (tp for tp in traded_this_season if tp.get("round") == rnd and tp.get("roster_id") == target_roster_id),
                      None,
                  )
                  if own_pick_traded:
                      current_owner = roster_id_to_name.get(own_pick_traded.get("owner_id"), "?")
                      if own_pick_traded.get("owner_id") != target_roster_id:
                          print(f"  Round {rnd}: Balls' own pick TRADED AWAY -> now owned by {current_owner}")
                      else:
                          print(f"  Round {rnd}: Balls' own pick (traded away then back) -> owned by Balls")
                  else:
                      print(f"  Round {rnd}: Balls' own pick (never traded) -> owned by Balls")

                  # Does Balls own anyone else's pick this round?
                  acquired = [
                      tp for tp in traded_this_season
                      if tp.get("round") == rnd and tp.get("roster_id") != target_roster_id and tp.get("owner_id") == target_roster_id
                  ]
                  for tp in acquired:
                      orig_name = roster_id_to_name.get(tp.get("roster_id"), "?")
                      print(f"  Round {rnd}: Balls ALSO owns {orig_name}'s pick (acquired via trade)")
          EOF
