name: Adhoc Debug

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'EOF'
          import json
          from newsletter import get_rosters, get_users, DEFAULT_LEAGUE_ID

          for label, league_id in [("Dynasty", DEFAULT_LEAGUE_ID), ("Redraft", "1312089746436030464")]:
              print(f"\n=== {label} league ===")
              rosters = get_rosters(league_id)
              users = get_users(league_id)
              users_by_id = {u["user_id"]: u for u in users}
              for roster in rosters[:3]:
                  owner_id = roster.get("owner_id")
                  user = users_by_id.get(owner_id, {})
                  print(f"roster_id={roster['roster_id']} owner_id={owner_id}")
                  print(f"  user.avatar = {user.get('avatar')!r}")
                  print(f"  user.metadata = {json.dumps(user.get('metadata'))}")
                  print(f"  roster.metadata = {json.dumps(roster.get('metadata'))}")
                  print(f"  roster.settings keys with 'avatar': "
                        f"{[k for k in (roster.get('settings') or {}) if 'avatar' in k.lower()]}")

              # Check one player_id's shape for headshot purposes
              players_sample_id = None
              for r in rosters:
                  if r.get("players"):
                      players_sample_id = r["players"][0]
                      break
              print(f"\nSample player_id from a roster: {players_sample_id!r}")
          EOF
