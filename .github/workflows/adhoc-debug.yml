name: Adhoc Debug

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'EOF'
          from collections import defaultdict
          from newsletter import (
              get_league, get_rosters, get_users, get_players, build_teams,
              player_display_name, player_value, DEFAULT_LEAGUE_ID,
          )

          league = get_league(DEFAULT_LEAGUE_ID)
          rosters = get_rosters(DEFAULT_LEAGUE_ID)
          users = get_users(DEFAULT_LEAGUE_ID)
          players = get_players()
          teams = build_teams(rosters, users)

          def pos_of(pid):
              p = players.get(pid) or {}
              return p.get("position") or "?"

          team_pos_values = {}
          all_players_league = []

          for r in rosters:
              team = teams.get(r["roster_id"])
              tname = team.team_name if team else f"roster_{r['roster_id']}"
              pids = r.get("players") or []
              pos_vals = defaultdict(list)
              for pid in pids:
                  val = player_value(pid, players)
                  pos = pos_of(pid)
                  name = player_display_name(pid, players)
                  pos_vals[pos].append((val, name))
                  all_players_league.append((val, name, pos, tname))
              for pos in pos_vals:
                  pos_vals[pos].sort(reverse=True)
              team_pos_values[tname] = pos_vals

          print("=== Per-team top assets by position (top 3, QB/RB/WR/TE) + group totals ===")
          for tname, pos_vals in team_pos_values.items():
              print(f"\n{tname}:")
              for pos in ["QB", "RB", "WR", "TE"]:
                  top = pos_vals.get(pos, [])[:3]
                  s = ", ".join(f"{n} (~{round(v)})" for v, n in top)
                  total = sum(v for v, n in pos_vals.get(pos, []))
                  print(f"  {pos}: {s}  [group total ~{round(total)}]")

          print("\n=== League-wide top 30 players by value ===")
          all_players_league.sort(reverse=True)
          for val, name, pos, tname in all_players_league[:30]:
              print(f"  {name} ({pos}) -- ~{round(val)} -- {tname}")
          EOF
