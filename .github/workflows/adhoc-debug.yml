name: Adhoc Debug

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'EOF'
          import json
          from newsletter import get_users, get_league, DEFAULT_LEAGUE_ID

          for label, league_id in [("Dynasty", DEFAULT_LEAGUE_ID), ("Redraft", "1312089746436030464")]:
              print(f"\n=== {label} league ===")
              league = get_league(league_id)
              print(f"league keys with 'commission' or 'owner': "
                    f"{[k for k in league if 'commission' in k.lower() or 'owner' in k.lower()]}")
              users = get_users(league_id)
              for u in users:
                  is_owner_keys = {k: v for k, v in u.items() if 'owner' in k.lower() or 'commission' in k.lower() or 'admin' in k.lower() or 'role' in k.lower()}
                  if is_owner_keys:
                      print(f"user_id={u['user_id']} display_name={u.get('display_name')} -> {json.dumps(is_owner_keys)}")
          EOF
