name: Adhoc Debug

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'EOF'
          from newsletter import (
              get_league, get_rosters, get_users, get_players, build_teams,
              get_nfl_state, get_recent_transactions, determine_week,
              player_display_name, player_value, DEFAULT_LEAGUE_ID,
          )

          league_id = DEFAULT_LEAGUE_ID
          league = get_league(league_id)
          rosters = get_rosters(league_id)
          users = get_users(league_id)
          players = get_players()
          teams = build_teams(rosters, users)

          roster_id_to_name = {r["roster_id"]: (teams.get(r["roster_id"]).team_name if teams.get(r["roster_id"]) else f"roster_{r['roster_id']}") for r in rosters}

          state = get_nfl_state()
          print(f"NFL state: {state}")
          week = determine_week(league_id, None)
          print(f"Determined week: {week}")

          lamar_id = None
          for pid, p in players.items():
              if (p.get("full_name") or "").strip().lower() == "lamar jackson" and p.get("position") == "QB":
                  lamar_id = pid
                  break
          print(f"Lamar Jackson player_id: {lamar_id}")

          txs = get_recent_transactions(league_id, week, weeks_back=6)
          print(f"Total recent transactions fetched: {len(txs)}")

          trades = [tx for tx in txs if tx.get("type") == "trade"]
          print(f"Total trades in window: {len(trades)}")

          for tx in trades:
              adds = tx.get("adds") or {}
              if lamar_id and lamar_id in adds:
                  print("\n=== FOUND Lamar Jackson trade ===")
                  print(f"transaction_id: {tx.get('transaction_id')}  status_updated: {tx.get('status_updated')}  created: {tx.get('created')}")
                  roster_ids = tx.get("roster_ids") or []
                  print(f"Rosters involved: {[roster_id_to_name.get(r, r) for r in roster_ids]}")

                  drops = tx.get("drops") or {}
                  draft_picks = tx.get("draft_picks") or []

                  received = {rid: [] for rid in roster_ids}
                  for pid, rid in adds.items():
                      name = player_display_name(pid, players)
                      val = round(player_value(pid, players))
                      received.setdefault(rid, []).append((name, val))
                  for pick in draft_picks:
                      new_owner = pick.get("owner_id")
                      season = pick.get("season")
                      rnd = pick.get("round")
                      orig = pick.get("roster_id")
                      orig_name = roster_id_to_name.get(orig, orig)
                      received.setdefault(new_owner, []).append((f"{season} Rd{rnd} pick (orig {orig_name})", None))

                  print("\nWhat each side received:")
                  totals = {}
                  for rid, items in received.items():
                      name = roster_id_to_name.get(rid, rid)
                      total = sum(v for _, v in items if v is not None)
                      totals[rid] = total
                      print(f"  {name} received:")
                      for iname, ival in items:
                          print(f"    - {iname}" + (f" (~{ival})" if ival is not None else " (pick, unvalued)"))
                      print(f"    TOTAL estimated player value received: ~{total}")

                  ranked = sorted(totals.items(), key=lambda kv: kv[1], reverse=True)
                  if len(ranked) >= 2:
                      diff = ranked[0][1] - ranked[1][1]
                      winner_name = roster_id_to_name.get(ranked[0][0], ranked[0][0])
                      print(f"\nEstimated winner (player-value only, picks unvalued above): {winner_name} by ~{diff}")
          EOF
